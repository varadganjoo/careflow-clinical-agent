name: CareFlow Clinical Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Run Test Suite
      run: |
        PYTHONPATH=. pytest tests/ -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install browser test dependencies
      run: |
        pip install -r requirements.lock playwright==1.64.1
        python -m playwright install --with-deps chromium
    - name: Check desktop and mobile review journeys
      env:
        CAREFLOW_BROWSER_TESTS: "1"
      run: python -m pytest tests/test_workstation.py -v

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check locked dependencies against current advisories
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.lock --no-deps --disable-pip
