[project]
name = "careflow-clinical-agent"
version = "0.1.0"
description = "Enterprise Clinical Workflow & Decision Support Platform with Gemini 3.6 Flash, MCP, and LangGraph HITL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
